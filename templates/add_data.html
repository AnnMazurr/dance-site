{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Ввод данных</h2>

<ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="pill" href="#club">Объединение</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="pill" href="#group">Группа</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="pill" href="#event">Мероприятие</a></li>
</ul>

<div class="tab-content">
    <!-- ФОРМА 1: ОБЪЕДИНЕНИЕ -->
    <div class="tab-pane fade show active" id="club">
        <div class="card shadow-sm p-4">
            <h5>Добавить новое объединение</h5>
            
            <!-- Форма для быстрого добавления направления -->
            <form method="POST" class="mb-4 p-3 bg-light border rounded">
                <input type="hidden" name="form_type" value="add_direction">
                <label class="form-label text-muted small">Нет нужного направления? Добавьте его:</label>
                <div class="input-group">
                    <input type="text" name="new_direction" class="form-control" placeholder="Название направления" required>
                    <button class="btn btn-outline-success" type="submit">+ Добавить направление</button>
                </div>
            </form>

            <form method="POST">
                <input type="hidden" name="form_type" value="add_club">
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Название</label><input type="text" name="club_name" class="form-control" required></div>
                    <div class="col-md-6 mb-3">
                        <label>Направление</label>
                        <select name="direction_id" class="form-select" required>
                            {% for d in directions %}<option value="{{ d.classifier_id }}">{{ d.classifier_name }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label>Город</label><input type="text" name="city" class="form-control" required></div>
                    <div class="col-md-4 mb-3"><label>Адрес</label><input type="text" name="address" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label>Телефон</label><input type="text" name="phone" class="form-control"></div>
                </div>
                <div class="mb-3"><label>Место</label><input type="text" name="venue" class="form-control"></div>
                <div class="mb-3"><label>Описание</label><textarea name="description" class="form-control"></textarea></div>
                <button type="submit" class="btn btn-primary">Сохранить объединение</button>
            </form>
        </div>
    </div>

    <!-- ФОРМА 2: ГРУППА -->
    <div class="tab-pane fade" id="group">
        <div class="card shadow-sm p-4">
            <h5>Добавить группу</h5>
            <form method="POST">
                <input type="hidden" name="form_type" value="add_group">
                <div class="mb-3">
                    <label>Объединение</label>
                    <select name="club_id" class="form-select" required>
                        {% for c in clubs %}<option value="{{ c.club_id }}">{{ c.club_name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3"><label>Название группы</label><input type="text" name="group_name" class="form-control" required></div>
                <div class="row">
                    <div class="col mb-3"><label>Возраст от</label><input type="number" name="age_min" class="form-control" required></div>
                    <div class="col mb-3"><label>Возраст до</label><input type="number" name="age_max" class="form-control" required></div>
                    <div class="col mb-3"><label>Цена</label><input type="number" name="price" class="form-control"></div>
                </div>
                <div class="mb-3"><label>Уровень</label><input type="text" name="level" class="form-control" required></div>
                <div class="mb-3"><label>Расписание</label><input type="text" name="schedule" class="form-control"></div>
                <button type="submit" class="btn btn-success">Сохранить группу</button>
            </form>
        </div>
    </div>

    <!-- ФОРМА 3: МЕРОПРИЯТИЕ -->
    <div class="tab-pane fade" id="event">
        <div class="card shadow-sm p-4">
            <h5>Добавить мероприятие</h5>
            <form method="POST">
                <input type="hidden" name="form_type" value="add_event">
                <div class="mb-3">
                    <label>Группа</label>
                    <select name="group_id" class="form-select" required>
                        {% for g in groups %}<option value="{{ g.group_id }}">{{ g.group_name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3"><label>Название</label><input type="text" name="event_name" class="form-control" required></div>
                <div class="row">
                    <div class="col mb-3">
                        <label>Тип</label>
                        <select name="event_type" class="form-select"><option>Занятие</option><option>Концерт</option><option>Конкурс</option></select>
                    </div>
                    <div class="col mb-3"><label>Дата</label><input type="date" name="event_date" class="form-control" required></div>
                </div>
                <div class="mb-3"><label>Место</label><input type="text" name="location" class="form-control"></div>
                <button type="submit" class="btn btn-info text-white">Сохранить мероприятие</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
